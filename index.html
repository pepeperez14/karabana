<!doctype html><html lang="eu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Karabana"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0b3d2e"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Karabana</title>
<meta name="description" content="Karabana: islamiar zibilizazioa eta Al-Andalus (2. gaia) ikasteko aplikazioa, mapekin eta lapitzarekin.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Karabana — Al-Andalusko patioa: berde sakona eta urrea kanpoan, paper krema barruan (gai bakarra, nahita). */
:root {
  --bg: #0b3d2e; --bg2: #11503c; --bg3: #17634a; --gold: #d4a017; --gold2: #f2d255; --goldl: #f7e9b8;
  --paper: #fbf7ec; --paper2: #f3ecd9; --grid: rgba(120, 90, 30, .09); --line: #e3d9c2;
  --ink: #2a2117; --navy: #1f4d3a; --muted: #6f655a; --soft: #efe6cf;
  --ok: #1f8a4c; --okbg: #e4f4e9; --no: #c2412d; --nobg: #fbe7e2; --part: #a86a00; --partbg: #fff2d6;
  --hud: #f2d255; --hudink: #2a1d00;
  --fd: "Marcellus", "Palatino", "Georgia", serif;
  --fb: "Nunito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --r: 18px; --r2: 12px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
button, a, input, label { touch-action: manipulation; }
body { margin: 0; background: var(--bg); color: #f4efe2; font-family: var(--fb); font-size: 17px; line-height: 1.5; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
body::after { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .5; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96' viewBox='0 0 96 96'><g fill='none' stroke='%23d4a017' stroke-opacity='.16' stroke-width='1.2'><path d='M48 4l12 32 32 12-32 12-12 32-12-32-32-12 32-12z'/><path d='M48 20l8 20 20 8-20 8-8 20-8-20-20-8 20-8z'/><circle cx='48' cy='48' r='6'/><path d='M0 48h12M84 48h12M48 0v12M48 84v12'/></g></svg>"); background-size: 96px 96px; }
#app { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 40px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--gold2); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--fd); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: .01em; font-weight: 400; }
p { margin: .4em 0; }
b { font-weight: 700; }
.small { font-size: .86em; }
.muted { color: var(--muted); }
.ic { width: 1.2em; height: 1.2em; flex: none; vertical-align: -.22em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 4px; border: 1px solid rgba(0, 0, 0, .25); }

/* ---------- goiko barra */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 0; background: linear-gradient(var(--bg) 70%, rgba(11, 61, 46, 0)); }
.top .ttl { flex: 1; min-width: 0; }
.top h1 { font-size: 1.42rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.eyebrow { display: block; font-family: var(--fb); font-weight: 700; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold2); }
.ib { display: inline-grid; place-items: center; width: 46px; height: 46px; border-radius: 14px; border: 1px solid rgba(212, 160, 23, .45); background: rgba(17, 80, 60, .8); color: #fff; flex: none; }
.ib:active { transform: scale(.95); }
.hud { display: flex; gap: 8px; align-items: center; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; background: rgba(17, 80, 60, .9); border: 1px solid rgba(212, 160, 23, .45); font-weight: 800; font-size: .95rem; color: #fff; font-variant-numeric: tabular-nums; }
.chip.coin .ic { color: var(--gold2); }
.chip.streak .ic { color: #ff9a5c; }
.dots { display: flex; gap: 5px; margin-top: 4px; }
.dots i { width: 14px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .22); }
.dots i.now { background: var(--gold2); }
.dots i.r1 { background: #5fd38a; } .dots i.r5 { background: #f2c94c; } .dots i.r0 { background: #ff7b66; }

/* ---------- hasiera */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; padding: 18px 20px; border-radius: 24px; background: radial-gradient(120% 140% at 0% 0%, #1b6b4f 0%, #11503c 55%, #0e4433 100%); border: 1px solid rgba(212, 160, 23, .4); }
.hero .who { display: flex; gap: 14px; align-items: center; min-width: 0; }
.hero .guide { width: 92px; flex: none; }
.hero h2 { font-size: 1.6rem; color: #fff; }
.hero .rank { color: var(--gold2); letter-spacing: .06em; text-transform: uppercase; font-size: .84rem; font-weight: 800; }
.xpbar { margin-top: 8px; height: 12px; border-radius: 99px; background: rgba(255, 255, 255, .14); overflow: hidden; max-width: 420px; }
.xpbar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #f2d255, #d4a017); transition: width .8s; }
.xpnote { font-size: .8rem; color: #e6dcc0; margin-top: 4px; }
.examcard { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 150px; padding: 12px 16px; border-radius: 16px; background: rgba(0, 0, 0, .22); border: 1px solid rgba(212, 160, 23, .5); text-align: center; }
.examcard b { font-family: var(--fd); font-size: 1.1rem; color: #fff; }
.examcard .days { font-weight: 800; color: var(--gold2); }
.examcard.past .days { color: #9fe3b8; }
.daily { margin-top: 14px; display: flex; gap: 16px; align-items: center; width: 100%; text-align: left; padding: 16px 18px; border-radius: 20px; border: 0; background: linear-gradient(100deg, #f2d255, #d4a017); color: var(--hudink); box-shadow: 0 10px 30px rgba(212, 160, 23, .25); }
.daily .dic { width: 54px; height: 54px; border-radius: 16px; background: rgba(255, 255, 255, .45); display: grid; place-items: center; flex: none; }
.daily .dic .ic { width: 30px; height: 30px; }
.daily h3 { font-size: 1.15rem; } .daily p { margin: 2px 0 0; font-size: .92rem; }
.sech { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 22px 2px 10px; }
.sech h2 { font-size: 1.12rem; color: #fff; letter-spacing: .06em; text-transform: uppercase; }
.sech span { color: #e6dcc0; font-size: .85rem; }
.route { display: grid; gap: 10px; }
.stop { position: relative; display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 12px 14px; border-radius: 18px; border: 1px solid rgba(212, 160, 23, .35); background: rgba(17, 80, 60, .85); color: #fff; }
.stop .sic { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #fff; flex: none; box-shadow: 0 0 0 4px rgba(255, 255, 255, .12); }
.stop .sic .ic { width: 28px; height: 28px; }
.stop .snum { display: block; font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gold2); font-weight: 800; }
.stop h3 { font-size: 1.15rem; }
.stop .smeta { display: flex; gap: 8px; align-items: center; font-size: .82rem; color: #e6dcc0; }
.stop.locked { opacity: .55; }
.stop.done .sic { box-shadow: 0 0 0 4px var(--gold2); }
.stop .trail { position: absolute; left: 40px; bottom: -11px; width: 3px; height: 12px; background: rgba(212, 160, 23, .5); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tiles.two { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 12px; }
.tile { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; padding: 14px; border-radius: 18px; border: 1px solid rgba(212, 160, 23, .3); background: rgba(17, 80, 60, .85); color: #fff; text-align: left; }
.tile[disabled] { opacity: .5; }
.tile .tic { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: var(--c); color: #fff; }
.tile .tic .ic { width: 24px; height: 24px; }
.tile h3 { font-size: 1.05rem; } .tile p { margin: 0; font-size: .82rem; color: #e6dcc0; }
.foot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 24px; }
.lnk { display: inline-flex; gap: 6px; align-items: center; padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(212, 160, 23, .35); background: rgba(0, 0, 0, .18); color: #fff; font-size: .95rem; }
.warnl { text-align: center; color: #ffd8cf; }

/* ---------- txartelak */
.card { color-scheme: light; background-color: var(--paper); color: var(--ink); border-radius: var(--r); box-shadow: 0 18px 40px rgba(0, 0, 0, .3); }
.paper { background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; background-position: -1px -1px; }
.panel { padding: 18px 20px; margin-top: 12px; }
.panel h3 { color: var(--navy); font-size: 1.15rem; margin-bottom: 8px; }
.sthead { display: flex; gap: 16px; align-items: center; padding: 16px 18px; border-radius: 20px; background: linear-gradient(100deg, var(--c), color-mix(in srgb, var(--c) 60%, #000)); color: #fff; }
.sthead .bigic { width: 70px; height: 70px; border-radius: 20px; background: rgba(255, 255, 255, .22); display: grid; place-items: center; flex: none; }
.sthead .bigic .ic { width: 40px; height: 40px; }
.sthead h2 { font-size: 1.5rem; }
.sthead .meta { display: flex; gap: 8px; align-items: center; font-size: .9rem; }
.mast { display: inline-flex; gap: 3px; vertical-align: middle; }
.mast i { width: 12px; height: 12px; border-radius: 3px; background: rgba(0, 0, 0, .15); }
.mast i.on1 { background: #f2c94c; } .mast i.on2 { background: #f2c94c; } .mast i.on3 { background: #5fd38a; } .mast i.on4 { background: #1f8a4c; }
.life { display: flex; gap: 14px; align-items: flex-start; }
.life .lic { width: 48px; height: 48px; border-radius: 14px; background: var(--c, var(--gold)); color: #fff; display: grid; place-items: center; flex: none; }
.life .lic .ic { width: 26px; height: 26px; }
.life .eyebrow { color: var(--muted); }
.glist { display: grid; gap: 8px; }
.glist.card { padding: 12px; }
.gitem { display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
.gitem .gst { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--navy); flex: none; }
.gitem.done .gst { background: var(--okbg); color: var(--ok); }

/* ---------- botoiak */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: 14px; border: 2px solid transparent; font-weight: 700; font-size: 1rem; }
.btn:active { transform: translateY(1px) scale(.99); }
.btn.primary { background: var(--navy); color: #fff; }
.btn.go { background: var(--ok); color: #fff; }
.btn.hot { background: linear-gradient(100deg, #f2d255, #d4a017); color: var(--hudink); }
.btn.ghost { background: #fff; color: var(--navy); border-color: #d9cfb5; }
.btn.ghost.on { background: var(--soft); border-color: var(--navy); }
.btn.soft { background: var(--soft); color: var(--navy); }
.btn.sm { min-height: 40px; padding: 6px 12px; font-size: .9rem; border-radius: 12px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.lifelink { border: 0; background: none; color: var(--navy); font-size: .9rem; text-decoration: underline; text-underline-offset: 3px; padding: 2px 0; }
.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
.grow { flex: 1; }

/* ---------- ariketak */
.prac { display: grid; gap: 14px; }
.ex { padding: 18px 20px 16px; }
.ex.inner { box-shadow: none; border: 1px solid var(--line); margin-top: 8px; }
.exhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
.skchip { display: inline-block; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--c) 18%, #fff); color: color-mix(in srgb, var(--c) 70%, #000); font-size: .82rem; font-weight: 800; }
.lvtag { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
.q { font-size: 1.15rem; line-height: 1.45; margin-bottom: 12px; }
.q .target { color: var(--no); font-size: 1.25em; }
.gapslot { display: inline-block; min-width: 4em; border-bottom: 3px solid var(--navy); text-align: center; font-weight: 800; color: var(--navy); }
.gapslot.ok { color: var(--ok); border-color: var(--ok); }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.opts.c1 { grid-template-columns: 1fr; }
.opts.tf { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { min-height: 54px; padding: 10px 14px; border-radius: 14px; border: 2px solid #d9cfb5; background: #fff; color: var(--ink); font-size: 1.02rem; text-align: left; line-height: 1.35; }
.opt.right { border-color: var(--ok); background: var(--okbg); }
.opt.wrong { border-color: var(--no); background: var(--nobg); }
.opt.off, .opt[disabled] { opacity: .5; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mcol { display: grid; gap: 8px; align-content: start; }
.tok { min-height: 48px; padding: 8px 12px; border-radius: 12px; border: 2px solid #d9cfb5; background: #fff; color: var(--ink); font-weight: 600; text-align: left; line-height: 1.3; }
.tok.sel { border-color: var(--navy); background: var(--soft); }
.tok.right { border-color: var(--ok); background: var(--okbg); }
.tok.wrong { border-color: var(--no); background: var(--nobg); }
.tok.used { opacity: .35; }
.tok.in { border-color: var(--navy); background: var(--soft); }
.ordslots { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 60px; padding: 8px; border-radius: 12px; border: 2px dashed #d9cfb5; margin-bottom: 10px; }
.ordslots .ph, .pyr .ph { color: var(--muted); }
.ordslots .sep { color: var(--muted); font-weight: 800; }
.ordpool { display: flex; flex-wrap: wrap; gap: 8px; }
.pyr { display: grid; gap: 6px; justify-items: center; margin-bottom: 10px; }
.plv { width: var(--w); min-height: 50px; display: grid; place-items: center; border-radius: 10px; background: #f6e7c8; border: 1px solid #c9a86a; padding: 4px; text-align: center; }
.plv .tok { width: 100%; justify-content: center; text-align: center; }
.sortcur { display: flex; justify-content: center; margin: 6px 0 12px; }
.sitem { display: inline-block; padding: 12px 18px; border-radius: 14px; background: var(--soft); border: 2px solid var(--navy); font-weight: 800; font-size: 1.1rem; }
.bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.bin { min-height: 64px; border-radius: 14px; border: 2px dashed var(--navy); background: #fff; color: var(--navy); font-weight: 800; font-size: 1.02rem; padding: 10px; }
.sortdone { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.sdone { padding: 4px 10px; border-radius: 999px; font-size: .82rem; background: var(--okbg); color: var(--ok); }
.sdone.no { background: var(--nobg); color: var(--no); }
.fbbox { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; margin-top: 12px; animation: pop .25s ease-out; }
.fbbox .guide { width: 52px; flex: none; }
.fbbox .ft { font-family: var(--fd); font-size: 1.1rem; }
.fbbox.ok { background: var(--okbg); border: 1px solid #a7dfc0; } .fbbox.ok .ft { color: var(--ok); }
.fbbox.no { background: var(--nobg); border: 1px solid #f3bcb0; } .fbbox.no .ft { color: var(--no); }
.fbbox.part { background: var(--partbg); border: 1px solid #eed38b; } .fbbox.part .ft { color: var(--part); }
.fbbox.inv { background: #f3efe4; border: 1px solid #ddd3bd; }
@keyframes pop { from { transform: scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
.sol { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: #fff; border: 1px solid var(--line); }
.sol h4 { color: var(--navy); margin-bottom: 6px; }
.sol ul { margin: 6px 0 0; padding-left: 20px; }
.pizarra { margin-top: 14px; padding: 10px; border-radius: 14px; background: #f7f3e8; border: 1px dashed #c9bb96; }
.pizarra h5 { margin: 0 0 6px; font: 800 .82rem/1.2 var(--fb); color: var(--navy); letter-spacing: .06em; text-transform: uppercase; display: flex; gap: 6px; align-items: center; }
.modelbox { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: #eef8f2; border: 1px solid #b5e2c8; }
.modelbox h5 { margin: 0 0 6px; font: 800 .9rem var(--fb); color: var(--ok); display: flex; gap: 6px; align-items: center; }
.model { line-height: 1.55; }
.keys { display: flex; flex-wrap: wrap; gap: 8px; }
.key { padding: 8px 12px; border-radius: 999px; border: 2px solid #c9bb96; background: #fff; font-weight: 700; }
.key.on { background: var(--ok); color: #fff; border-color: var(--ok); }
.summary { text-align: center; padding: 8px 0; }
.summary .guide { width: 96px; }
.summary h2 { color: var(--navy); font-size: 1.6rem; margin: 6px 0; }
.summary .score { font-family: var(--fd); font-size: 3.2rem; color: var(--navy); line-height: 1; margin: 6px 0; }
.summary .score span { font-size: 1.2rem; color: var(--muted); }
.sumgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; max-width: 460px; margin: 12px auto; }
.sumgrid div { padding: 10px; border-radius: 12px; background: #fff; border: 1px solid var(--line); }
.sumgrid b { display: block; font-family: var(--fd); font-size: 1.5rem; color: var(--navy); }
.sumgrid span { font-size: .78rem; color: var(--muted); }
.stars { display: flex; justify-content: center; gap: 6px; }
.stars svg { width: 44px; height: 44px; }
.lvchange { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 8px 0; }
.unlockmsg { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 10px 0 0; color: var(--ok); font-weight: 700; }

/* ---------- mapak */
.mapbox { position: relative; border-radius: 14px; overflow: hidden; border: 2px solid #c9bb96; background: #bfe0f3; margin: 8px 0; }
.mapbox.sm { max-width: 420px; }
.geo { display: block; width: 100%; height: auto; }
.geo .pin .dot { fill: #c2412d; stroke: #fff; stroke-width: 2.5; }
.geo .pin.ok .dot { fill: #1f8a4c; } .geo .pin.no .dot { fill: #000; } .geo .pin.sel .dot { fill: #2f6fdf; }
.geo .pin { cursor: pointer; }
.geo .pin:active .dot { r: 9; }
.geo .plab { font: 700 15px var(--fb); fill: #2a2117; stroke: #fff; stroke-width: 4px; paint-order: stroke; }
.geo .alab { font: 800 15px var(--fb); fill: #6f5e3f; letter-spacing: .14em; opacity: .9; }
.geo .tlab { font: 800 11px var(--fb); fill: #3a2f1f; stroke: #fff; stroke-width: 3px; paint-order: stroke; }
.geo .arrow { fill: none; stroke: #c2412d; stroke-width: 3.5; stroke-linecap: round; marker-end: none; stroke-dasharray: 10 6; }
.geo.lgtxt .plab { font-size: 24px; stroke-width: 6px; }
.geo.lgtxt .pin .dot { r: 9; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .84rem; margin: 2px 0 6px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(0, 0, 0, .25); }
.laysteps { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.laysteps .btn { text-align: left; }
.wgoal { margin-top: 8px; font-size: .95rem; color: var(--navy); font-weight: 600; min-height: 1.4em; }
.xmap { display: grid; grid-template-columns: 1fr minmax(260px, 420px); gap: 14px; align-items: start; }
.maporder { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.mth { position: relative; padding: 4px; border-radius: 12px; }
.mth .geo { border-radius: 8px; }

.tlbar { position: relative; display: flex; gap: 3px; height: 74px; margin: 10px 0 0; }
.tle { flex: 1 1 0; min-width: 0; height: 56px; border: 2px solid #fff; border-radius: 8px; background: #e9a85c; color: #2a2117; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 2px 6px; overflow: hidden; }
.tle:nth-child(2) { background: #f0c27a; } .tle:nth-child(3) { background: #e6a15c; } .tle:nth-child(4) { background: #d9b27a; } .tle:nth-child(5) { background: #e07a5a; }

.tlend { position: absolute; right: 0; bottom: 0; font-size: .78rem; font-weight: 700; }
.handrow { display: grid; grid-template-columns: minmax(200px, 280px) 1fr; gap: 14px; align-items: start; }
.handsvg, .citysvg { width: 100%; height: auto; }
.ftip { cursor: pointer; } .ftip.ok circle { fill: #e4f4e9; stroke: #1f8a4c; }
.citysvg [data-c] { cursor: pointer; }
.handq p { margin: 0 0 8px; font-weight: 600; }

/* ---------- ikasgaia */
.lesson { padding: 18px 20px; margin-top: 4px; }
.lprog { display: flex; gap: 6px; margin-bottom: 14px; }
.lprog i { flex: 1; height: 7px; border-radius: 99px; background: #e2dccb; }
.lprog i.on { background: var(--c); }
.lesson h2 { color: var(--navy); font-size: 1.45rem; margin-bottom: 8px; }
.lp { font-size: 1.05rem; line-height: 1.6; }
.lp ul, .lp ol { padding-left: 22px; margin: 6px 0; }
.lp li { margin: 4px 0; }
.lp.es { margin-top: 8px; padding: 10px 14px; border-radius: 12px; background: #fff; border: 1px solid var(--line); color: #4a4036; font-size: .98rem; }
.esrow { margin-top: 8px; }
.extra { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: #fff3d6; border: 2px solid #f0cf7a; }
.extra .rtag, .rule .rtag { display: flex; align-items: center; gap: 6px; font-size: .76rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #8a5a00; margin-bottom: 4px; }
.tt { border-collapse: collapse; width: 100%; margin: 6px 0; font-size: .96rem; }
.tt th { background: #cfe3c3; text-align: left; padding: 6px 8px; font-weight: 800; }
.tt td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tt tr:nth-child(even) td { background: #f3f6ec; }
ol.five li { margin: 6px 0; }
.hopts { display: grid; gap: 10px; margin-top: 10px; }
.lnav { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
.wbox { margin-top: 12px; padding: 12px; border-radius: 14px; background: #fff; border: 1px solid var(--line); }
.wbox .wtools { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }

/* ---------- hiztegia, txartelak */
.hz { padding: 10px 14px; display: grid; gap: 6px; }
.hw { display: grid; grid-template-columns: 150px 130px 1fr; gap: 10px; align-items: baseline; padding: 8px 6px; border-bottom: 1px solid var(--line); }
.hw b { color: var(--navy); font-size: 1.05rem; } .hw .es { color: #8a5a00; font-style: italic; } .hw .def { font-size: .92rem; }
.hw.known b::after { content: " ✓"; color: var(--ok); }
.fc { margin-top: 10px; }
.fcard { position: relative; min-height: 280px; perspective: 1200px; }
.fcard .front, .fcard .back { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 20px; border-radius: 22px; background: var(--paper); color: var(--ink); box-shadow: 0 18px 40px rgba(0, 0, 0, .3); backface-visibility: hidden; transition: transform .5s; text-align: center; }
.fcard .front b { font-family: var(--fd); font-size: 2.2rem; color: var(--navy); }
.fcard .back { transform: rotateY(180deg); background: #fff8e6; }
.fcard .back b { font-family: var(--fd); font-size: 1.5rem; color: var(--navy); } .fcard .back .es { color: #8a5a00; font-style: italic; font-size: 1.1rem; }
.fcard.flip .front { transform: rotateY(180deg); } .fcard.flip .back { transform: rotateY(0); }

/* ---------- eskema */
.eskwrap { overflow: auto; border-radius: 14px; background: var(--paper); color: var(--ink); color-scheme: light; touch-action: pan-x pan-y pinch-zoom; }
.esk { width: 1400px; padding: 18px; }
.ebd { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; grid-template-areas: "t t t" "a b c" "f f f"; font-size: 13.5px; line-height: 1.35; }
.etitle { grid-area: t; display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-radius: 14px; background: linear-gradient(100deg, #0b3d2e, #17634a); color: #fff; }
.etitle h1 { font-size: 1.9rem; letter-spacing: .06em; } .etitle .esub { margin-left: auto; color: var(--gold2); font-weight: 800; letter-spacing: .1em; text-transform: uppercase; font-size: .8rem; }
.etitle .ornament { font-size: 2rem; color: var(--gold2); }
.ecol { display: grid; gap: 10px; align-content: start; }
.c1 { grid-area: a; } .c2 { grid-area: b; } .c3 { grid-area: c; }
.efoot { grid-area: f; display: grid; gap: 8px; }
.dates { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.dates span { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 6px 4px; border-radius: 8px; background: #fff; border: 1.5px solid #c9bb96; font-size: .82rem; line-height: 1.2; }
.dates b { font-family: var(--fd); font-size: 1.15rem; color: #c2412d; }
.ehead { padding: 8px 12px; border-radius: 10px; background: var(--c); color: #fff; font-family: var(--fd); font-size: 1.1rem; }
.ebox { padding: 10px 12px; border-radius: 12px; background: #fff; border: 1.5px solid #c9bb96; }
.ebox h4 { color: var(--navy); font-size: 1rem; margin-bottom: 4px; }
.ebox ul { margin: 0; padding-left: 16px; } .ebox li { margin: 2px 0; }
.ebox.row { display: grid; grid-template-columns: 1fr 190px; gap: 8px; align-items: center; }
.ebox.stage { display: grid; grid-template-columns: 30px 1fr 120px; gap: 8px; align-items: center; }
.ebox.stage .sn { width: 30px; height: 30px; border-radius: 50%; background: #0e8f8a; color: #fff; font-weight: 800; display: grid; place-items: center; }
.ebox.stage p { margin: 2px 0; font-size: .92rem; }
.ebox .yrs { font-weight: 800; color: #0e8f8a; }
.mini { border-radius: 8px; overflow: hidden; border: 1px solid #c9bb96; }
.mini .geo { width: 100%; height: auto; }
.mini.wide { margin-top: 6px; }
.tline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tline span { padding: 6px; border-radius: 8px; background: #e4f4e9; font-size: .88rem; text-align: center; }
.trick { margin: 6px 0 0; padding: 4px 8px; border-radius: 8px; background: #fff3d6; border: 1px solid #f0cf7a; font-size: .88rem; }
.five { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 6px; }
.five span { text-align: center; padding: 6px 2px; border-radius: 8px; background: #efe6cf; font-weight: 800; color: var(--navy); font-size: 1.1rem; }
.five small { display: block; font-size: .66rem; font-weight: 700; color: var(--ink); }
.pyrsvg { width: 100%; height: auto; }

/* ---------- leihoak, abisuak, insigniak, familia */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(5, 25, 18, .72); backdrop-filter: blur(3px); }
.modal .card { width: min(560px, 100%); max-height: 90vh; overflow: auto; padding: 22px 22px 18px; }
.modal h2 { color: var(--navy); font-size: 1.4rem; margin-bottom: 8px; }
.mbtns { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 66px); z-index: 80; padding: 10px 16px; border-radius: 99px; background: var(--hud); color: var(--hudink); font-weight: 800; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); animation: toast 1.9s ease forwards; pointer-events: none; white-space: nowrap; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 12% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }
.confetti { position: fixed; inset: 0; z-index: 70; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 10px; height: 14px; border-radius: 2px; }
.tinput { width: 100%; height: 52px; padding: 0 14px; border-radius: 12px; border: 2px solid #d9cfb5; font: 500 1.15rem var(--fb); color: var(--ink); background: #fff; }
.fieldl { display: block; font-weight: 700; margin: 10px 0 4px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #efe9da; flex-wrap: wrap; }
.seg { display: inline-flex; border-radius: 12px; overflow: hidden; border: 2px solid #d9cfb5; }

.tblwrap { overflow: auto; }

.okline, .warnline { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; margin: 0 0 10px; font-size: .92rem; }
.okline { background: var(--okbg); color: #0b5e33; } .warnline { background: var(--partbg); color: #6b4a00; }
.okline .ic, .warnline .ic { width: 20px; height: 20px; flex: none; margin-top: 1px; }
.examintro { display: flex; gap: 16px; align-items: flex-start; }
.examintro .guide { flex: none; }

.ink { display: grid; gap: 8px; }
.inktools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.itool .ic { width: 22px; height: 22px; }
.isep { width: 1px; height: 30px; background: #d9cfb5; margin: 0 4px; }
.icol { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; background: var(--k); box-shadow: 0 0 0 2px #d9cfb5; }
.icol.on { box-shadow: 0 0 0 3px var(--navy); transform: scale(1.08); }
.inkstage { position: relative; width: 100%; max-width: 100%; border-radius: 12px; background: #fff; border: 1px solid #d9cfb5; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.inkstage.grid { background-image: linear-gradient(rgba(120, 90, 30, .12) 1px, transparent 1px), linear-gradient(90deg, rgba(120, 90, 30, .12) 1px, transparent 1px); background-size: 24px 24px; }
.inkbg, .inkbg svg, .inkstage canvas, .inkover { position: absolute; inset: 0; width: 100%; height: 100%; }
.inkbg, .inkover { pointer-events: none; }
.inkstage canvas { touch-action: none; }
.inkhint { font-size: .84rem; color: var(--muted); }
.inkcount { font-size: .92rem; font-weight: 700; color: var(--navy); margin-top: 6px; min-height: 1.3em; }
.pad { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; background: #fbf9f3; color: var(--ink); color-scheme: light; }
.padbar { display: flex; gap: 10px; align-items: center; padding: calc(env(safe-area-inset-top, 0px) + 8px) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); background: #fff; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.padq { flex: 1 1 260px; min-width: 0; max-height: 120px; overflow: auto; font-size: .95rem; padding: 6px 10px; border-radius: 10px; background: #f3efe4; }
.padcv { flex: 1; min-height: 0; overflow: auto; padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 10px) max(12px, env(safe-area-inset-left, 0px)); }
.padcv .ink { max-width: 1100px; margin: 0 auto; }

@media (max-width: 700px) {
  body { font-size: 16px; }

  .xmap { grid-template-columns: 1fr; }
  .handrow { grid-template-columns: 1fr; }

  .top h1 { font-size: 1.15rem; }
  .hud .chip.streak { display: none; }
  .examintro { flex-direction: column; }
}

  { k: 2, h: 'Kordobako Emirerri independientea', y0: 756, y1: 929, es: 'Emirato independiente de Córdoba', layers: ['m2', 'k2'], key: 'Abd ar Rahman printzea Damaskotik ihes egin eta Al-Andalusen babestu zen. Abd ar Rahman I izena hartuta emir independientea bihurtu zen. Botere politiko eta militarra emirrak; botere erlijiosoa Bagdadeko kalifak.', cities: ['Kordoba', 'Zaragoza', 'Bartzelona', 'Iruñea'], verb: 'Emir bihurtu' },

const L = KB.LESSONS = {};
L.meka = [
  { t: 'hook', h: 'Zer uste duzu?', p: 'VII. mendean, Arabia zer zen batez ere?', opts: [
    { h: 'Ekialdearen eta Mendebaldearen arteko <b>merkataritza-gune</b> bat', ok: true, fb: 'Horixe! Karabanak Arabiatik pasatzen ziren. Horregatik ziren arabiarrak merkatariak.' },
    { h: 'Inperio handi eta bateratu bat', ok: false, fb: 'Ez oraindik: arabiarrak <b>tribuetan</b> antolatuta zeuden. Inperioa geroago sortu zen.' },
    { h: 'Erresuma kristau bat', ok: false, fb: 'Ez: arabiarrak <b>politeistak</b> ziren (jainko asko gurtzen zituzten).' }] },
  { t: 'x', h: 'Arabia VII. mendean', eu: 'VII. mendean Arabiako penintsula, <b>Ekialdearen eta Mendebaldearen arteko merkataritza-gune</b> bat zen. Pertsiar eta bizantziar inperioek inguratzen zuten.<br><br>Arabiarrak, <b>tribuetan</b> antolatuta zeuden <b>merkatariak eta abeltzainak</b> ziren eta politeistak ziren. Izan ere, hiri guztien artean <b>Meka</b> nabarmentzen zen.',
    es: 'En el siglo VII la península arábiga era un centro comercial entre Oriente y Occidente. Los imperios persa y bizantino la rodeaban. Los árabes eran comerciantes y ganaderos organizados en tribus y eran politeístas. Entre todas las ciudades destacaba la Meca.',
    extra: '<b>Politeista</b> = jainko <b>asko</b> (poli = asko). <b>Monoteista</b> = jainko <b>bakarra</b> (mono = bat). Islamak monoteismoa ekarri zuen Arabiara.' },
  { t: 'map', h: 'Non dago Arabia?', p: 'Ukitu mapako puntuak. Arabia bi inperio handiren artean zegoen: <b>Bizantzioa</b> (ipar-mendebaldean) eta <b>Pertsia</b> (ekialdean).', map: 'A', layers: ['arabia632', 'bizantzio'], extraLayers: { persia: true }, pins: ['Meka', 'Medina', 'Konstantinopla', 'Persia', 'Damasko', 'Jerusalem'], legend: [['arabia632', 'Arabia (Islama 632an)'], ['bizantzio', 'Bizantziar inperioa'], ['persia', 'Pertsiar inperioa']] },
  { t: 'x', h: 'Mahoma eta erlijio berria', eu: '<table class="tt"><tr><th>NOIZ?</th><th>ZER?</th></tr><tr><td><b>570</b></td><td><b>Mahoma jaio zen.</b> Bere bizitzan merkataritzan jardun zuen. Arabian, Sirian eta Palestinan egindako bidaietan merkatari juduak eta kristauak ezagutu zituen.</td></tr><tr><td><b>610</b></td><td><b>Gabriel goiangeruak</b> iragarri zion Alak (Jainkoak) erlijio monoteista berri bat predikatzeko hautatu zuela: <b>islama</b>.</td></tr><tr><td><b>622</b></td><td>Merkatariek ez zuten Mahomaren mezua onartu eta <b>Medinara ihes</b> egin zuen. Honi <b>Hejira</b> deitzen zaio eta <b>musulmanen egutegiaren hasiera</b> adierazten du. Hango biztanleak islamera bihurtu zituen eta Arabiako tribuen artean predikatu zuen. Jarraitzaile asko lortu eta <b>Meka konkistatu</b> zuen.</td></tr><tr><td><b>632</b></td><td><b>Mahoma hil zen.</b> Arabiar gehienak musulmanak ziren eta jada batasun politikoa ezarri zen. <b>Kalifa</b> agintari gorena zen.</td></tr></table>',
    es: '570: nació Mahoma; se dedicó al comercio y en sus viajes conoció a comerciantes judíos y cristianos. 610: el arcángel Gabriel le anunció que Alá le había elegido para predicar una nueva religión monoteísta, el islam. 622: los comerciantes no aceptaron su mensaje y huyó a Medina (Hégira: inicio del calendario musulmán); convirtió a sus habitantes, predicó entre las tribus y conquistó la Meca. 632: murió Mahoma; la mayoría de los árabes eran musulmanes y había unidad política; el califa era la máxima autoridad.',
    extra: '<b>Daten trukoa:</b> 570 → <b>+40</b> → 610 → <b>+12</b> → 622 → <b>+10</b> → 632. Mahomak 40 urte zituen Gabriel agertu zitzaionean, 52 Hejiran eta 62 hil zenean.<br><b>Hejira</b> = «ihesa» (Mekatik Medinara). Musulmanen urtea 1 da 622a, kristauen urtea 1 Kristo jaio zenekoa den bezala.' },
  { t: 'w', h: 'Ordenatu Mahomaren bizitza', p: 'Ukitu gertaerak ordenan, lehenengotik azkenera.', w: 'order', args: { items: ['Gabriel goiangeruak Ala-k hautatu duela iragarri (610)', 'Mahoma jaio (570)', 'Mahoma hil; kalifa agintari gorena (632)', 'Hejira: Medinara ihes egin (622)'], order: [1, 0, 3, 2] } },
  { t: 'try', h: 'Egiaztatu', stop: 'meka' },
  { t: 'life' }
];
L.damasko = [
  { t: 'hook', h: 'Zer uste duzu?', p: 'Musulmanen hedapena <b>motela</b> izan zen?', opts: [
    { h: 'Ez: ehun urte baino gutxiagoan Iberiar penintsulatik Indiaraino iritsi ziren', ok: true, fb: 'Bai! 632tik 750era, inperio erraldoia. Oso azkarra.' },
    { h: 'Bai: mende asko behar izan zituzten', ok: false, fb: 'Ez: oso azkarra izan zen. 711n Iberiar penintsulan zeuden, Mahoma hil eta 79 urtera.' }] },
  { t: 'x', h: 'Hedapen militarra', eu: 'Musulmanek <b>hedapen militarra</b> burutu zuten, inguruko inperioen ahultasunaz baliatuz eta hitzarmenak sinatuz. Horrela, inperio handi bat konkistatu zuten, <b>Iberiar penintsulatik Indiaraino</b>, eta <b>merkatal-bide garrantzitsuak kontrolatu</b> zituzten.',
    es: 'Los musulmanes llevaron a cabo un despliegue militar aprovechando la debilidad de los imperios vecinos y firmando convenios. Así conquistaron un gran imperio, de la península Ibérica hasta la India, y controlaron importantes rutas comerciales.',
    extra: '<b>Azterketarako gakoa:</b> hedapena azkarra izan zen eta <b>bi bidetatik</b>: armak (hedapen militarra) eta hitzarmenak (akordioak). Zergatik hain azkar? Inguruko inperioak (Bizantzioa eta Pertsia) <b>ahulduta</b> zeuden, elkarren aurkako gerrengatik.' },
  { t: 'map', h: 'Hedapenaren mapa', p: 'Ukitu geruzak hedapena urratsez urrats ikusteko. Ukitu puntuak izenak ikusteko.', map: 'A', steps: [['arabia632', 'Islama Mahoma hil ondoren (632)'], ['kalifak661', 'Lehenengo kalifen konkistak (632-661)'], ['omeiak750', 'Omeiatarren konkistak (661-750)'], ['abbas', 'Abbastarren konkistak (750etik aurrera)']], layers: ['frankoak', 'bizantzio'], pins: ['Meka', 'Medina', 'Damasko', 'Jerusalem', 'Bagdad', 'Kairo', 'Kairuan', 'Kordoba', 'Poitiers', 'Konstantinopla', 'Talas', 'Palermo'], legend: [['frankoak', 'Frankoen erresuma'], ['bizantzio', 'Bizantziar inperioa']], stops: [['Poitiers', '732: frankoek musulmanen hedapena geldiarazi zuten'], ['Konstantinopla', '718: bizantziarrek hiria defendatu zuten'], ['Talas', '751: ekialdeko muga']] },
  { t: 'x', h: 'Nondik nora', eu: '<ul><li><b>632-661</b> · lehenengo kalifak: Siria, Palestina, Egipto, Mesopotamia eta Pertsia.</li><li><b>661-750</b> · omeiatarrak (hiriburua <b>Damasko</b>): Afrikako iparraldea, <b>Al-Andalus</b> (711) eta ekialdean Indiaraino.</li><li><b>750etik aurrera</b> · abbastarrak (hiriburua <b>Bagdad</b>).</li></ul><p>Hedapena <b>hiru lekutan gelditu</b> zen: <b>Konstantinopla</b> (718), <b>Poitiers</b> (732, frankoen aurka) eta <b>Talas</b> (751).</p>',
    es: '632-661, primeros califas: Siria, Palestina, Egipto, Mesopotamia y Persia. 661-750, omeyas (capital Damasco): norte de África, Al-Andalus (711) y hasta la India. Desde 750, abasíes (capital Bagdad). La expansión se detuvo en Constantinopla (718), Poitiers (732) y Talas (751).',
    extra: '<b>Bi dinastiak nahastu gabe:</b> <b>Omeiatarrak</b> → <b>D</b>amasko (biak «O» eta «D» … «OmeiaD»); <b>Abbastarrak</b> → <b>B</b>agdad (biak «B»rekin: a<b>BB</b>astarrak, <b>B</b>agdad). Hau garrantzitsua da Al-Andalus ulertzeko: abbastarrek omeiatarrak tronutik kendu zituztenean, omeiatar bat (Abd ar Rahman) Al-Andalusera ihes egin zuen.' },
  { t: 'w', h: 'Non gelditu zen hedapena?', p: 'Ukitu mapan hedapena gelditu zen <b>hiru</b> lekuak.', w: 'mappick', args: { map: 'A', layers: ['omeiak750', 'frankoak', 'bizantzio'], pins: ['Poitiers', 'Konstantinopla', 'Talas', 'Kordoba', 'Bagdad', 'Meka', 'Kairo', 'Damasko'], targets: ['Poitiers', 'Konstantinopla', 'Talas'], hint: 'Bat mendebaldean (frankoen erresuman), bat Bizantzion eta bat ekialdean, urrun.' } },
  { t: 'try', h: 'Egiaztatu', stop: 'damasko' },
  { t: 'life' }
];
L.meskita = [
  { t: 'hook', h: 'Zer uste duzu?', p: 'Zenbat betebehar nagusi ditu musulman batek?', opts: [{ h: 'Bost', ok: true, fb: 'Bai: esku bateko hatzak bezala, <b>bost</b>.' }, { h: 'Hiru', ok: false, fb: 'Gehiago: <b>bost</b> dira, esku bateko hatzak bezala.' }, { h: 'Hamar', ok: false, fb: 'Gutxiago: <b>bost</b> dira, esku bateko hatzak bezala.' }] },
  { t: 'x', h: 'Erlijioaren ezaugarriak', eu: '<ul><li>Erlijio <b>monoteista</b>.</li><li><b>Korana</b> bere liburu sakratua.</li><li><b>Lege sakratuak</b> eguneroko bizitzarako: txerririk ez jatea, alkoholik ez edatea, ausazko jokoetan parte ez hartzea.</li><li><b>Aldaerak</b> daude: <b>sunitak</b> (Korana eta tradizio sunna onartzen dute) eta <b>xiitak</b> (Korana bakarrik onartzen dute).</li></ul>',
    es: 'Religión monoteísta. El Corán es su libro sagrado. Leyes sagradas para la vida cotidiana: no comer cerdo, no beber alcohol, no participar en juegos de azar. Existen variantes: suníes (admiten el Corán y la tradición sunní) y chiíes (solo admiten el Corán).',
    extra: '<b>Sunitak / xiitak trukoa:</b> <b>S</b>unitak → <b>S</b>unna + Korana = <b>bi</b> gauza. <b>X</b>iitak → Korana <b>bakarrik</b> = gauza <b>bat</b>. (Sunitak gehiengoa dira gaur egun ere.)' },
  { t: 'x', h: 'Musulmanen bost betebeharrak', eu: '<ol class="five"><li><b>Fede-lanbidea</b>: Ala Jainko bakarra dela eta Mahoma bere profeta dela aldarrikatzea.</li><li><b>Otoitza</b>: egunean bost aldiz otoitz egin Mekara begira. Ostirala egun sakratua da eta fededunak meskitara joaten dira otoitz egitera. Otoitzaren aurretik, garbitasun-erritu bat egin behar dute, <b>abluzio</b> izenekoa.</li><li><b>Erromesaldia</b>: gutxienez behin egin behar dute erromesaldia Mekara.</li><li><b>Baraua</b>: hilabete santuan, <b>ramadana</b> deiturikoan, debekatuta dago bazkaltzea eguzkia sartu arte.</li><li><b>Limosna</b>: nahitaezkoa da beharra duten pertsonei laguntzeko.</li></ol>',
    es: 'Profesión de fe (Alá es el único Dios y Mahoma su profeta). Oración: cinco veces al día mirando a la Meca; el viernes es sagrado y los fieles acuden a la mezquita; antes, la ablución (rito de pureza). Peregrinación a la Meca al menos una vez. Ayuno en el ramadán: prohibido comer hasta la puesta del sol. Limosna obligatoria para ayudar a los necesitados.',
    extra: '<b>Eskuaren trukoa (5 hatz = 5 betebehar):</b> erpurua <b>F</b>edea («ados» keinua), hatz erakuslea <b>O</b>toitza (zerura seinalatzen), hatz luzea <b>E</b>rromesaldia (bide luzeena), hatz nagia <b>B</b>araua (eraztuna: hilabete bat) eta hatz txikia <b>L</b>imosna (txikia, baina beharrezkoa). <b>F-O-E-B-L</b>.' },
  { t: 'w', h: 'Esku bat, bost betebehar', p: 'Ukitu hatz bakoitza eta aukeratu zein betebehar den.', w: 'hand', args: {} },
  { t: 'x', h: 'Zenbakiak gogoratzeko', eu: '<ul><li><b>1</b> Jainko (Ala), <b>1</b> liburu (Korana), <b>1</b> profeta (Mahoma).</li><li><b>5</b> otoitz egunean, <b>5</b> betebehar.</li><li><b>1</b> erromesaldi bizitzan (gutxienez), <b>1</b> hilabete barau (ramadana), ostirala <b>1</b> egun sakratu astean.</li></ul>', es: '1 Dios, 1 libro, 1 profeta. 5 oraciones al día, 5 deberes. 1 peregrinación, 1 mes de ayuno, 1 día sagrado (viernes).', extra: 'Azterketan «azaldu» eskatzen badizute, zenbaki hauek erantzun osoa egituratzen laguntzen dizute.' },
  { t: 'try', h: 'Egiaztatu', stop: 'meskita' },
  { t: 'life' }
];
L.zokoa = [
  { t: 'hook', h: 'Zer uste duzu?', p: 'Zein zen musulmanen jarduera ekonomiko <b>nagusia</b>?', opts: [{ h: 'Merkataritza', ok: true, fb: 'Bai: merkatariak ziren hasieratik, eta inperioak merkatal-bideak kontrolatzen zituen.' }, { h: 'Meatzaritza', ok: false, fb: 'Ez: <b>merkataritza</b> zen nagusia (eta nekazaritza iraultzen zuten).' }, { h: 'Arrantza', ok: false, fb: 'Ez: <b>merkataritza</b> zen nagusia (eta nekazaritza iraultzen zuten).' }] },
  { t: 'x', h: 'Nekazaritza irauli zuten', eu: '<ul><li><b>Labore eta ureztatze-sistema berriak</b> erabili zituzten, produktibitatea handituz. <b>Gurpil hidraulikoa, noria eta ubideak</b> erabili zituzten.</li><li><b>Oinarria</b>: zerealak, barazkiak, lekaleak, arroza, fruta-arbolak eta usain-landareak.</li><li><b>Merkataritzarako</b>: masustondoak, ehunak (kotoia, lihoa), sendagarriak eta papera egitekoak.</li></ul>',
    es: 'Revolucionaron la agricultura: nuevos cultivos y sistemas de riego (rueda hidráulica, noria y canales) aumentaron la productividad. Base: cereales, verduras, legumbres, arroz, frutales y plantas de olor. Para el comercio: moras, tejidos (algodón, lino), medicinales y de papel.',
    extra: '<b>Bi multzo:</b> «oinarria» = <b>jateko</b> (zerealak, barazkiak, lekaleak, arroza, fruta); «merkataritzarako» = <b>saltzeko</b> (masustondoa → zeta egiteko, kotoia eta lihoa → ehunak, sendagarriak, papera). <b>Ura</b> da gakoa: noria eta ubideak gaur egun ere ikus daitezke Valentzian eta Murtzian.' },
  { t: 'w', h: 'Jateko ala saltzeko?', p: 'Sailkatu labore bakoitza: oinarria (jateko) ala merkataritzarako (saltzeko).', w: 'sort', args: { bins: ['Oinarria (jateko)', 'Merkataritzarako'], items: [['zerealak', 0], ['arroza', 0], ['masustondoak', 1], ['kotoia', 1], ['lekaleak', 0], ['lihoa', 1], ['fruta-arbolak', 0], ['sendagarriak', 1], ['barazkiak', 0], ['papera egitekoak', 1]] } },
  { t: 'x', h: 'Merkataritza, jarduera nagusia', eu: '<ul><li><b>Zoko</b> edo azoketan ematen zen.</li><li><b>Nekazaritza-produktuak</b> salerosten ziren.</li><li><b>Artisautza</b> auzoetan antolatzen zen, gremioen arabera: larrua, zeramika, burdingintza, ehunak…</li><li><b>Nazioarteko merkataritza</b> gora egin zuen mende horietan. Adibidez Ekialdetik, espeziak eta luxuzko manufakturak ekartzen zituzten.</li></ul><p>Moneta-sistema bateratua sortu zuten, <b>urrezko dinarra eta zilarrezko dirhama</b>. Lurralde musulman eta kristauetan erabiltzen ziren.</p>',
    es: 'El comercio era la principal actividad: se daba en zocos o ferias; se comercializaban productos agrícolas; la artesanía se organizaba en barrios según los gremios (cuero, cerámica, ferretería, textiles…); el comercio internacional creció (de Oriente traían especias y manufacturas de lujo). Crearon un sistema monetario unificado: el dinar de oro y el dirham de plata, usados en territorios musulmanes y cristianos.',
    extra: '<b>Txanponen trukoa:</b> <b>dinaRRa</b> ↔ <b>uRRea</b> (bi «r»); <b>dirhama</b> ↔ zilarra (gainerakoa). Karabana honetan irabazten dituzun txanponak dinarrak dira!<br><b>Gremioa</b> = lanbide bereko artisauen elkartea; auzo berean bizi eta lan egiten zuten (horregatik gaur egun ere kaleek lanbide-izenak dituzte: Zapatari kalea, Hargin kalea…).' },
  { t: 'try', h: 'Egiaztatu', stop: 'zokoa' },
  { t: 'life' }
];
L.medina = [
  { t: 'hook', h: 'Zer uste duzu?', p: 'Nor zegoen gizarte-piramidearen goialdean?', opts: [{ h: 'Kalifa', ok: true, fb: 'Bai: kalifa zen agintari politiko gorena.' }, { h: 'Aristokrazia', ok: false, fb: 'Ia: aristokrazia bigarren mailan zegoen. Goian <b>kalifa</b>.' }, { h: 'Erlijio-agintariak', ok: false, fb: 'Erlijio-agintariak aristokraziaren barruan zeuden. Goian <b>kalifa</b>.' }] },
  { t: 'x', h: 'Gizartea', eu: 'Mundu islamiarreko <b>biztanleria oso anitza</b> zen, etnia eta erlijio ugarikoa. Gizartearen gehiengoa erlijio musulmanekoa zen eta <b>maila sozialen arabera</b> bereizten zen:<ol><li><b>Kalifa</b>: agintari politiko gorena.</li><li><b>Aristokrazia</b>: lurren jabeak eta tratulari handiak. Botere politiko-ekonomikoa. Goi-funtzionarioak, erlijio-agintariak, zientzialariak…</li><li><b>Herri xehea</b>: merkatariak, artisauak… Politikan parte hartu gabe. Gehienak nekazariak ziren, jabetzarik gabekoak.</li><li><b>Esklaboak</b>: etxeko lanetan edo armadan borrokatzeko erabiliak.</li></ol>',
    es: 'La población era muy variada, con múltiples etnias y religiones. La mayoría era musulmana y se diferenciaba por estratos sociales: 1) Califa: máxima autoridad política. 2) Aristocracia: propietarios de tierras y grandes negociantes; poder político-económico; altos funcionarios, autoridades religiosas, científicos. 3) Pueblo llano: comerciantes, artesanos… sin participar en política; la mayoría campesinos sin propiedad. 4) Esclavos: trabajo doméstico o ejército.',
    extra: '<b>Piramidearen trukoa: K-A-H-E</b> (goitik behera): <b>K</b>alifa, <b>A</b>ristokrazia, <b>H</b>erri xehea, <b>E</b>sklaboak. Zenbat eta gorago, orduan eta gutxiago (eta botere gehiago).' },
  { t: 'w', h: 'Eraiki piramidea', p: 'Ukitu taldeak goitik behera, boterearen ordenan.', w: 'order', args: { items: ['Herri xehea (merkatariak, artisauak, nekazariak)', 'Kalifa', 'Esklaboak', 'Aristokrazia (lurjabeak, goi-funtzionarioak…)'], order: [1, 3, 0, 2], pyramid: true } },
  { t: 'x', h: 'Beste erlijioak eta emakumeak', eu: '<p><b>Zer gertatzen zen beste erlijioekin?</b></p><ul><li><b>Juduak</b>: artisauak edo merkatariak ziren. <b>Judutegi</b> auzoan bizi ziren.</li><li><b>Kristauak edo mozarabiarrak</b>: nekazariak eta artisauak ziren.</li></ul><p><b>Nolakoa zen emakumeen egoera?</b> Koranaren arabera…</p><ul><li>Familiako burua gizona zen eta emakumeak bere agindupean zeuden.</li><li>Emakumeak harenean egotea, beloarekin aurpegia estaltzea eta etxean otoitz egitea gomendatzen da.</li></ul><table class="tt"><tr><th>GIZONAK</th><th>EMAKUMEAK</th></tr><tr><td>Poligamia: 4 emazte izan ditzakete</td><td>Senar bakarra; bestela, zigorra.</td></tr><tr><td>Dibortziatzeko eskubidea</td><td>Dibortziatzeko tratu txarrak egiaztatu behar ditu</td></tr><tr><td>Dibortziatzean, seme-alabak berarekin geratuko dira.</td><td></td></tr><tr><td>Herentzian bi aldiz gehiago jasoko du.</td><td></td></tr></table>',
    es: 'Otras religiones: judíos (artesanos o comerciantes; vivían en la judería) y cristianos o mozárabes (campesinos y artesanos). Mujeres, según el Corán: el jefe de familia era el hombre; se recomienda que estén en el harén, se cubran la cara con el velo y recen en casa. Jurídicamente: hombres (poligamia, 4 esposas; derecho a divorciarse; los hijos se quedan con él; heredan el doble) frente a mujeres (un marido; para divorciarse deben demostrar malos tratos).',
    extra: '<b>Mozarabiarrak</b> = Al-Andalusen bizi ziren <b>kristauak</b> (arabiarren artean bizi zirenak). Ez nahastu <b>mudejarrekin</b> (kristau erresumetan bizi ziren musulmanak; ez da gai honetakoa, baina galdetzen badute, hori da aldea).' },
  { t: 'x', h: 'Hirien garrantzia', eu: 'Hiriak <b>jarduera ekonomiko, sozial eta politikoaren erdiguneak</b> ziren eta horregatik, oso populatuak zeuden. Ezaugarriak:<ul><li><b>Harresiz</b> inguratuta zeuden.</li><li><b>Kale estuak</b> eta <b>ordenik gabeko trazadura</b> zuten (laberintoa bezala).</li><li><b>Medina</b>n (erdian) jarduera politiko eta kulturalak.</li><li><b>Zokoa</b>n jarduera ekonomikoak: merkatua, artisautza.</li><li><b>Mezkita</b>, gune erlijiosoa.</li></ul>',
    es: 'Las ciudades eran el centro de la actividad económica, social y política y estaban muy pobladas. Rodeadas de murallas; calles estrechas y trazado sin orden (como un laberinto); actividades políticas y culturales en la medina (centro); económicas en el zoco (mercado, artesanía); la mezquita, centro religioso.',
    extra: '<b>Hiru guneak:</b> <b>Medina</b> = erdia (gobernatu eta kultura); <b>zokoa</b> = saldu eta erosi; <b>meskita</b> = otoitz egin. Hiru hitzak, hiru ekintza: <i>agindu · saldu · otoitz egin</i>. Beste eraikin batzuk (mapan ikusiko dituzu): <b>alkazarra</b> (jauregia), <b>alkazaba</b> (gotorlekua), <b>madrasa</b> (eskola), <b>hammam</b> (bainu publikoak), <b>alondegia</b> (merkatarien ostatua eta biltegia), <b>alcaiceria</b> (zokoaren barruko gune itxia, gauza baliotsuak saltzeko).' },
  { t: 'w', h: 'Hiri musulmana', p: 'Ukitu hiriaren atal bakoitza eta esan zer den.', w: 'city', args: {} },
  { t: 'try', h: 'Egiaztatu', stop: 'medina' },
  { t: 'life' }
];
L.andalus = [
  { t: 'hook', h: 'Zer uste duzu?', p: 'Zein urtetan sartu ziren musulmanak Iberiar penintsulan?', opts: [{ h: '711', ok: true, fb: 'Bai! 711: Guadaleteko gudua. Data hau <b>beti</b> galdetzen dute.' }, { h: '622', ok: false, fb: '622 Hejira da (Medinara ihesa). Penintsulan <b>711</b>n sartu ziren.' }, { h: '1492', ok: false, fb: '1492 amaiera da (Granada). Hasiera <b>711</b>.' }] },
  { t: 'x', h: 'Al-Andalus', eu: 'Al-Andalus VIII. mendean Iberiar penintsulan sortu zen <b>estatu musulmana</b> izan zen, <b>Omeiatarren dinastiak</b> sortua hain zuzen.<p><b>Bost etapa</b> ditu. Trukoa, bost aditzekin: <b>Konkistatu</b> (711) → <b>Emir bihurtu</b> (756) → <b>Kalifa izendatu</b> (929) → <b>Taifetan zatitu</b> (1031) → <b>Granadan amaitu</b> (1238-1492).</p>',
    es: 'Al-Andalus fue un Estado musulmán fundado en el siglo VIII en la península Ibérica por la dinastía de los Omeya. Tiene cinco etapas: conquista (711), emirato (756), califato (929), taifas (1031) y reino de Granada (1238-1492).',
    extra: '<b>Daten trukoak:</b> <b>711</b> = «zazpi-bat-bat»; <b>722</b> = 711 + 11 (Covadonga); <b>756</b>, <b>929</b> (ia 1000 baino lehen), <b>1031</b> (kalifatoa ehun urte eta pixka bat: 929 → 1031), <b>1212</b> = «bat-bi-bat-bi» (Navas de Tolosa), <b>1238</b> eta <b>1492</b> (Kolon Amerikara iritsi zen urte berean!).' },
  { t: 'tl', h: 'Denbora-lerroa', p: 'Ukitu etapa bakoitza bere mapa eta laburpena ikusteko.' },
  { t: 'x', h: '1. Erresuma bisigodoen konkista (711-718)', eu: '711an musulmanek Gibraltarko itsasartea zeharkatu eta bisigodoak <b>Guadaleteko Guduan</b> garaitu zituzten.<br><br>Iparralderantz egin zuten eta <b>722an ia penintsula osoa kontrolatzen zuten</b>, gune menditsuena izan ezik.', es: 'En 711 los musulmanes cruzaron el estrecho de Gibraltar y derrotaron a los visigodos en la batalla de Guadalete. Se dirigieron hacia el norte y en 722 controlaban casi toda la península, salvo la zona más montañosa.', extra: '<b>Zenbat urte behar izan zituzten?</b> 711tik 722ra: <b>11 urte</b> bakarrik (ariketa 10). <b>Gune menditsua</b> = Kantauriko mendiak (Asturias): hor hasi zen kristauen erresistentzia (Covadonga, 722).', map: 'B', stage: 1 },
  { t: 'x', h: '2. Kordobako Emirerri independientea (756-929)', eu: 'Bagdadeko Abbastar dinastiak omeiatarrak tronutik kendu zituztenean, Omeia familiako kide bat, <b>Abd ar Rahman</b> printzea Damaskotik ihes egin eta Al Andalusen babestu zen. <b>Abd ar Rahman I</b> izena hartuta <b>emir independientea</b> bihurtu zen eta Kordobako Emirerri independientea sortu zuen.<br><br>Emirrak botere politiko eta militarra izatera pasa zuen Al-Andalusen, baina botere erlijiosoa Bagdadeko Kalifaren esku mantendu zen.', es: 'Cuando los omeyas fueron destronados por la dinastía abasí de Bagdad, el príncipe Abd ar Rahman huyó de Damasco y se refugió en Al-Andalus. Abd ar Rahman I se convirtió en emir independiente y fundó el Emirato de Córdoba. El emir tenía el poder político y militar, pero el poder religioso se mantuvo en manos del califa de Bagdad.', extra: '<b>Emir vs kalifa:</b> emirrak <b>politika eta armada</b> agintzen ditu; kalifak, gainera, <b>erlijioa</b>. Emirerrian, erlijio-agintea oraindik Bagdaden zegoen: «independentea» politikoki bakarrik.', map: 'B', stage: 2 },
  { t: 'x', h: '3. Omeiatarren kalifatoaren distira (929-1031)', eu: '<b>Abd ar Rahman III</b>ak bere burua kalifa izendatu zuen eta Bagdadeko erlijio aginpidetik independizatu zen, <b>Kordobako kalifatoa</b> sortuz.<br><br>Garai hau <b>kulturaren eta ekonomiaren oparotasun garaia</b> izan arren, <b>barne gatazka ugari</b> izan zituen eta Leon, Nafarroa eta Gaztelaren (kristau erresumen) aurrerapena geldiarazi zituen <b>Al-Mansurren</b> espedizio militarrei esker.', es: 'Abd ar Rahman III se autoproclamó califa y se independizó de la autoridad religiosa de Bagdad, creando el califato de Córdoba. A pesar de la prosperidad cultural y económica, tuvo numerosos conflictos internos y frenó el avance de León, Navarra y Castilla gracias a las expediciones militares de Al-Mansur.', extra: '<b>Abd ar Rahman I</b> (emirra, 756) eta <b>Abd ar Rahman III</b> (kalifa, 929): izen bera, bi pertsona, bi etapa. Trukoa: <b>I</b> = <b>I</b>ndependentzia politikoa (emirra); <b>III</b> = <b>hiru</b> botereak (politikoa, militarra eta erlijiosoa) = kalifa. <b>Al-Mansur</b> = «garailea»: kristau erresumak erasotzen zituen gudalburua (Santiago eta Bartzelona ere eraso zituen).', map: 'B', stage: 3 },
  { t: 'x', h: '4. Taifa erresumen zatiketa (1031-1238)', eu: 'XI. mendeko barne liskarrak direla eta, 1031. urtean Kordobako azken kalifa kargutik kendu zuten eta kalifatoa hainbat <b>erresuma independenteetan (taifak)</b> zatitu zen.<br><br>Erresuma hauek ahulak ziren, eta beraien arteko erasoak etengabeak, ondorioz ezin izan zieten erreinu kristauen bultzada militarrei aurre egin.<br><br><b>1212an Navas de Tolosako batailan</b> kristauek Taifa gehienak konkistatu zituzten.', es: 'Debido a las disputas internas del siglo XI, en 1031 el último califa de Córdoba fue destituido y el califato se dividió en varios reinos independientes (taifas). Eran débiles y con continuos ataques entre ellos, por lo que no pudieron resistir a los reinos cristianos. En 1212, en la batalla de las Navas de Tolosa, los cristianos conquistaron la mayoría de las taifas.', extra: '<b>Taifa</b> = «taldea, alderdia»: kalifatoa puskatu zenean sortu ziren erresuma txikiak (Zaragoza, Toledo, Badajoz, Sevilla, Granada, Valentzia, Murtzia, Denia…). <b>Batuta indartsu, zatituta ahul</b>: horregatik aurreratu zuten kristauek.', map: 'B', stage: 4 },
  { t: 'x', h: '5. Granadako erresuma nazaria (1238-1492)', eu: 'Kristauek Taifa guztiak konkistatu ostean, <b>musulmanen erresuma bakarra Granadakoa</b> izan zen, 1238. urtean <b>dinastia nazariak</b> (Nasr) sortua. Nahiz eta erresuma oparoa izan, errege nazariek zerga handiak ordaintzen zizkioten Gaztelari (inguruko erresuma kristaua).<br><br>1492an Errege-erregina katolikoek erresuma konkistatu zuten <b>Boabdil</b>ek (Granadako azken erregea) amore eman zuenean.', es: 'Tras la conquista cristiana de todas las taifas, el único reino musulmán fue el de Granada, fundado en 1238 por la dinastía nazarí (Nasr). Aunque era próspero, los reyes nazaríes pagaban grandes impuestos a Castilla. En 1492 los Reyes Católicos conquistaron el reino cuando Boabdil, último rey de Granada, se rindió.', extra: '<b>Nazariak</b> (Nasr dinastia) <b>Alhambra</b> eraiki zuten, Granadako jauregi ospetsua. <b>Zerga</b> = dirua ordaindu Gaztelari bakean uzteko. <b>1492</b>: Al-Andalusen amaiera eta, urte berean, Kolon Amerikara.', map: 'B', stage: 5 },
  { t: 'w', h: 'Zein etapa da?', p: 'Begiratu mapa eta aukeratu etapa.', w: 'mapid', args: {} },
  { t: 'try', h: 'Egiaztatu', stop: 'andalus' },
  { t: 'life' }
];

  { id: 'g5', stop: 'zokoa', q: 'Zer ekarpen egin zituzten musulmanek nekazaritzan?', model: 'Nekazaritza <b>irauli</b> zuten: <b>labore berriak</b> (arroza, fruta-arbolak, usain-landareak, masustondoak, kotoia, lihoa…) eta <b>ureztatze-sistema berriak</b> erabili zituzten (<b>gurpil hidraulikoa, noria eta ubideak</b>), produktibitatea handituz.', keys: ['labore', 'ureztatze', 'noria', 'ubide', 'produktibitate'] },
  { id: 'g6', stop: 'zokoa', q: 'Zer produktu ekartzen zituzten musulmanek?', model: '<b>Ekialdetik espeziak eta luxuzko manufakturak</b> ekartzen zituzten (nazioarteko merkataritza). Gainera, merkataritzarako laboreak lantzen zituzten: masustondoak, ehunak (kotoia, lihoa), sendagarriak eta papera egitekoak.', keys: ['espezia', 'luxu', 'Ekialde'] },

  { id: 'g8', stop: 'medina', q: 'Marraztu mundu islamiarraren gizarte-piramidea eta azaldu maila bakoitza.', model: 'Goitik behera: <b>1. Kalifa</b> (agintari politiko gorena). <b>2. Aristokrazia</b> (lurren jabeak eta tratulari handiak; botere politiko-ekonomikoa; goi-funtzionarioak, erlijio-agintariak, zientzialariak). <b>3. Herri xehea</b> (merkatariak, artisauak eta, gehienak, nekazariak jabetzarik gabekoak; politikan parte hartu gabe). <b>4. Esklaboak</b> (etxeko lanak edo armada). Beste erlijioak: juduak (artisauak, merkatariak; judutegian) eta mozarabiarrak (kristauak; nekazariak eta artisauak).', keys: ['Kalifa', 'Aristokrazia', 'Herri xehea', 'Esklabo'], draw: true },

    } });

  UI.mountExercise(host, UI.prepare({ t: 'write', id }), { color: s.color, chip: 'Idatziz', onDone: r => { UI.record(g.stop, r); UI.S.gal[id] = Math.max(UI.S.gal[id] || 0, r.credit); UI.addDinar(dinarFor(r)); UI.save(); UI.checkBadges(); refreshHud(); const nx = KB.GALDERAK[KB.GALDERAK.indexOf(g) + 1]; host.innerHTML = '<div class="summary">' + UI.guide(r.credit ? 'cheer' : 'happy', 'guide') + '<h2>' + (r.credit === 1 ? 'Erantzun osoa!' : r.credit ? 'Ia osoa' : 'Berriro saiatu gero') + '</h2><p>Zure idatzia gordeta geratzen da: azterketa aurretik berrirakurri.</p><div class="actions" style="justify-content:center"><button type="button" class="btn ghost" data-nav="back">Itzuli</button>' + (nx ? '<button type="button" class="btn hot" data-nav="galdera" data-replace="1" data-arg="' + nx.id + '">Hurrengo galdera ' + UI.ic('next') + '</button>' : '') + '</div></div>'; } });
};

/* ======================================================= mapen atlasa */
SCR.atlas = function () {

/* ======================================================= hiztegia */
SCR.hiztegia = function (mode) {
  const S = UI.S;
  if (mode === 'cards') return flashcards();
  let h = topbar({ title: 'Hiztegia', eyebrow: KB.HIZTEGIA.length + ' hitz · euskara → gaztelania' });
  h += '<div class="actions" style="margin:4px 0 10px"><button type="button" class="btn hot" data-nav="hiztegia" data-arg="cards">' + UI.ic('play') + ' Txartelekin ikasi</button><span class="grow"></span><span class="small" style="color:#f1e9d2">Ezagunak: ' + Object.values(S.hz).filter(x => x >= 2).length + '</span></div>';
  KB.STOPS.forEach(s => { const ws = KB.HIZTEGIA.filter(w => w[3] === s.id); h += '<div class="sech"><h2>' + s.name + '</h2></div><div class="card paper hz">' + ws.map(w => '<div class="hw' + ((S.hz[w[0]] || 0) >= 2 ? ' known' : '') + '"><b>' + w[0] + '</b><span class="es">' + w[1] + '</span><span class="def">' + w[2] + '</span></div>').join('') + '</div>'; });
  appEl().innerHTML = h;
};
function flashcards() {
  const S = UI.S;
  const order = UI.shuffle(KB.HIZTEGIA).sort((a, b) => (S.hz[a[0]] || 0) - (S.hz[b[0]] || 0)).slice(0, 15);
  let i = 0, known = 0, flipped = false;
  appEl().innerHTML = topbar({ title: 'Txartelak', eyebrow: '15 hitz · lehenengo, gutxien ezagutzen dituzunak' }) + '<section class="fc"></section>';
  const el = $('.fc');
  const draw = () => {
    if (i >= order.length) { el.innerHTML = '<div class="card paper summary">' + UI.guide('cheer', 'guide') + '<h2>Txanda amaituta</h2><p><b>' + known + '</b> / ' + order.length + ' hitz ezagunak.</p><div class="actions" style="justify-content:center"><button type="button" class="btn ghost" data-nav="hiztegia" data-replace="1">Zerrenda</button><button type="button" class="btn hot" data-nav="hiztegia" data-arg="cards" data-replace="1">Beste txanda bat</button></div></div>'; UI.addDinar(known); UI.checkBadges(); return; }
    const w = order[i];
    el.innerHTML = '<div class="fcard' + (flipped ? ' flip' : '') + '" role="button" tabindex="0"><div class="front"><span class="small muted">' + (i + 1) + ' / ' + order.length + ' · ukitu buelta emateko</span><b>' + w[0] + '</b></div><div class="back"><b>' + w[0] + '</b><span class="es">' + w[1] + '</span><p>' + w[2] + '</p></div></div>' + (flipped ? '<div class="actions" style="justify-content:center"><button type="button" class="btn ghost" data-k="0">' + UI.ic('x2') + ' Ez nekien</button><button type="button" class="btn go" data-k="1">' + UI.ic('check') + ' Banekien</button></div>' : '');
    $('.fcard', el).onclick = () => { if (!flipped) { flipped = true; UI.snd('tap'); draw(); } };
    $$('[data-k]', el).forEach(b => b.onclick = () => { const ok = b.dataset.k === '1'; S.hz[w[0]] = Math.max(0, (S.hz[w[0]] || 0) + (ok ? 1 : -1)); if (ok) known++; UI.save(); i++; flipped = false; draw(); });
  };
  draw();
}

/* ======================================================= eskema */
SCR.eskema = function () {
  let lang = UI.S.set.esk || 'eu', mode = 'fit';
  appEl().innerHTML = topbar({ title: 'Eskema grafikoa', eyebrow: 'Gai osoa begirada batean' }) + '<div class="actions" style="margin:0 0 8px"><span class="seg dark" data-k="lang"><button type="button" data-v="eu">Euskaraz</button><button type="button" data-v="es">Castellano</button></span><button type="button" class="btn ghost sm" data-z="fit">' + UI.ic('zoom') + ' Osorik</button><button type="button" class="btn ghost sm" data-z="1">' + UI.ic('search') + ' Handitu</button></div><div class="eskwrap"><div class="esk"></div></div><p class="small" style="color:#f1e9d2;margin-top:8px">Familiak PDF bertsioa du inprimatzeko (euskaraz eta gaztelaniaz).</p>';
  const wrap = $('.eskwrap'), esk = $('.esk');
  const fit = () => { const w = wrap.clientWidth; const sc = mode === 'fit' ? Math.min(1, w / 1400) : 1; esk.style.transform = 'scale(' + sc + ')'; esk.style.transformOrigin = '0 0'; wrap.style.height = mode === 'fit' ? (esk.offsetHeight * sc) + 'px' : ''; wrap.style.overflow = mode === 'fit' ? 'hidden' : 'auto'; $$('[data-z]').forEach(b => b.classList.toggle('on', b.dataset.z === (mode === 'fit' ? 'fit' : '1'))); };
  const draw = () => { esk.innerHTML = UI.eskemaHTML(lang); $$('.seg[data-k="lang"] button').forEach(b => b.classList.toggle('on', b.dataset.v === lang)); fit(); };
  $$('[data-z]').forEach(b => b.onclick = () => { mode = b.dataset.z; fit(); });
  $$('.seg[data-k="lang"] button').forEach(b => b.onclick = () => { lang = b.dataset.v; UI.S.set.esk = lang; UI.save(); UI.snd('tap'); draw(); });
  draw(); const ro = new ResizeObserver(fit); ro.observe(wrap); UI.onLeave(() => ro.disconnect());
};

/* ======================================================= insigniak, ezarpenak, familia */
SCR.badges = function () { const S = UI.S; appEl().innerHTML = topbar({ title: 'Insigniak', eyebrow: Object.keys(S.badges).length + ' / ' + BADGES.length }) + '<div class="badges">' + BADGES.map(b => { const on = !!S.badges[b.id]; return '<div class="badge' + (on ? '' : ' off') + '">' + badgeSVG(b, on) + '<h4>' + b.h + '</h4><p>' + b.p + '</p></div>'; }).join('') + '</div>'; };
function settings() {
  const S = UI.S;
  const m = UI.modal('<h2>Ezarpenak</h2><label class="fieldl" for="setname">Izena</label><input id="setname" class="tinput" maxlength="24" value="' + esc(S.name) + '" autocomplete="off">'
    + '<div class="switch"><span>' + UI.ic('sound') + ' Soinuak</span><span class="seg" data-k="sound"><button type="button" data-v="1" class="' + (S.set.sound ? 'on' : '') + '">Bai</button><button type="button" data-v="0" class="' + (!S.set.sound ? 'on' : '') + '">Ez</button></span></div>'
    + '<div class="switch"><span>' + UI.ic('pencil') + ' Marraztu eta idatzi</span><span class="seg" data-k="finger"><button type="button" data-v="0" class="' + (!S.set.finger ? 'on' : '') + '">Lapitzarekin bakarrik</button><button type="button" data-v="1" class="' + (S.set.finger ? 'on' : '') + '">Lapitza eta hatza</button></span></div>'
    + '<p class="small muted">«Lapitzarekin bakarrik»: pantailan apoiatutako eskuak ez du margotzen.</p>', [{ t: 'Gorde', cls: 'primary', fn: el => { S.name = $('#setname', el).value.trim().slice(0, 24) || 'Álex'; UI.save(); UI.go(CUR ? CUR[0] : 'home', CUR ? CUR[1] : null, { noPush: true }); } }]);
  m.el.addEventListener('click', e => { const b = e.target.closest('.seg button'); if (!b) return; const seg = b.parentElement, k = seg.dataset.k; $$('button', seg).forEach(x => x.classList.toggle('on', x === b)); if (k === 'sound') S.set.sound = b.dataset.v === '1'; if (k === 'finger') S.set.finger = b.dataset.v === '1'; UI.save(); UI.snd('tap'); });
}
function familyGate() {
  const a = 6 + Math.floor(Math.random() * 4), b = 6 + Math.floor(Math.random() * 4);
  const m = UI.modal('<h2>Zona para la familia</h2><p>Para entrar, responde: ¿cuánto es <b>' + a + ' × ' + b + '</b>?</p><input id="gate" class="tinput" inputmode="numeric" autocomplete="off" aria-label="Respuesta"><p class="small muted fberr" style="min-height:1.2em"></p>', [{ t: 'Cancelar', cls: 'ghost' }, { t: 'Entrar', cls: 'primary', fn: el => { if (+$('#gate', el).value.trim() === a * b) { setTimeout(() => UI.go('family'), 10); return true; } $('.fberr', el).textContent = 'No es correcto.'; return false; } }]);
  $('#gate', m.el).addEventListener('keydown', e => { if (e.key === 'Enter') $('.mbtns .btn.primary', m.el).click(); });
}
function ago(ts) { if (!ts) return '—'; const d = Math.floor((Date.now() - ts) / 86400000); return d <= 0 ? 'hoy' : d === 1 ? 'ayer' : 'hace ' + d + ' días'; }
function storageStatus() {
  if (!UI.storageOk()) return '<p class="warnline">' + UI.ic('warn') + ' Este navegador no deja guardar datos (¿modo privado?). El progreso se perderá al cerrar.</p>';
  if (UI.standalone) return '<p class="okline">' + UI.ic('check') + ' App instalada en la pantalla de inicio: el progreso se queda guardado en este iPad.</p>';
  if (UI.framed) return '<p class="warnline">' + UI.ic('warn') + ' Está abierta dentro de otra página (por ejemplo, claude.ai): Safari puede borrar el progreso al cerrarse. Usa la versión instalada en la pantalla de inicio.</p>';
  return '<p class="warnline">' + UI.ic('warn') + ' Está abierta en una pestaña del navegador. Para que el progreso no se borre, añádela a la pantalla de inicio (Compartir → «Añadir a pantalla de inicio») y ábrela siempre desde ese icono.</p>';
}
SCR.family = function () {
  const S = UI.S;
  const days = Object.entries(S.days), active = days.filter(([, v]) => v.n > 0).length, secs = days.reduce((a, [, v]) => a + (v.s || 0), 0);
  const tm = secs >= 3600 ? Math.floor(secs / 3600) + ' h ' + Math.round((secs % 3600) / 60) + ' min' : Math.round(secs / 60) + ' min';
  const first = S.tot.n ? Math.round(S.tot.first / S.tot.n * 100) : 0;
  const ES = { meka: 'Nacimiento del islam', damasko: 'La expansión', meskita: 'La religión', zokoa: 'La economía', medina: 'Sociedad y ciudades', andalus: 'Las 5 etapas de Al-Andalus' };
  const LVES = ['Sin empezar', 'Empezado', 'Familiar', 'Dominado', 'Maestro'];
  const recs = [];
  const weak = KB.STOPS.filter(s => UI.st(s.id).att >= 3 && UI.st(s.id).lv <= 1); if (weak.length) recs.push('Le cuesta: <b>' + weak.map(s => ES[s.id]).join(', ') + '</b>. Conviene repetir la lección y una ronda de práctica.');
  const nl = KB.STOPS.find(s => !UI.st(s.id).lesson); if (nl) recs.push('Siguiente lección pendiente: <b>' + nl.name + ' · ' + ES[nl.id] + '</b>.');
  const gq = KB.GALDERAK.length - Object.keys(S.gal).length; if (gq > 0) recs.push('Le quedan <b>' + gq + '</b> preguntas de examen por responder por escrito. Son las más parecidas al examen real.');
  if (!S.exam.length) recs.push('Todavía no ha hecho ningún <b>simulacro de examen</b>. Recomendado desde el lunes.'); else if (Math.max(...S.exam.map(e => e.score)) < 7) recs.push('Mejor simulacro: <b>' + Math.max(...S.exam.map(e => e.score)) + '/10</b>. Repasar las zonas marcadas al final del simulacro.');
  if ((S.mapOk || 0) < 10) recs.push('Mapas: lleva <b>' + (S.mapOk || 0) + '</b> ejercicios de mapa acertados. En el examen siempre cae uno: que practique «Al-Andalus» y el atlas.');
  if (!recs.length) recs.push('¡Todo en orden! Que siga con la «Karabana del día» hasta el examen.');
  let html = topbar({ title: 'Panel para la familia', eyebrow: 'Progreso de ' + esc(S.name) + ' · examen: miércoles 28 de octubre' });
  html += '<section class="card panel"><div class="kpis"><div><b>' + active + '</b><span>días estudiando</span></div><div><b>' + tm + '</b><span>tiempo activo</span></div><div><b>' + S.tot.n + '</b><span>ejercicios</span></div><div><b>' + first + ' %</b><span>a la primera</span></div></div><p class="small muted">Racha: ' + UI.streakNow() + ' · dinares: ' + S.dinar + ' · simulacros: ' + (S.exam.length ? S.exam.map(e => e.score + '/10').join(', ') : 'ninguno') + '</p></section>';
  html += '<section class="card panel"><h3>Recomendaciones</h3><ul class="recs">' + recs.map(r => '<li>' + r + '</li>').join('') + '</ul></section>';
  html += '<section class="card panel"><h3>Dominio por parada</h3><div class="tblwrap"><table class="mtab"><thead><tr><th>Parada</th><th>Nivel</th><th class="num">Ejercicios</th><th class="num">Acierto</th><th>Última vez</th></tr></thead><tbody>' + KB.STOPS.map(s => { const k = UI.st(s.id); return '<tr><td><b>' + s.name + '</b> ' + ES[s.id] + '</td><td>' + UI.mastSq(k.lv) + ' <span class="small">' + LVES[k.lv] + '</span></td><td class="num">' + k.att + '</td><td class="num">' + (k.att ? Math.round(k.ok / k.att * 100) + ' %' : '—') + '</td><td>' + ago(k.last) + '</td></tr>'; }).join('') + '</tbody></table></div></section>';
  html += '<section class="card panel"><h3>Preguntas de examen respondidas por escrito</h3><p>' + Object.keys(S.gal).length + ' de ' + KB.GALDERAK.length + '. Sus respuestas escritas a mano se guardan en el iPad; puede releerlas desde «Azterketa-galderak».</p></section>';
  html += '<section class="card panel"><h3>Guardar el progreso</h3>' + storageStatus() + '<div class="actions"><button type="button" class="btn primary" data-f="bk">' + UI.ic('download') + ' Guardar copia de seguridad</button><button type="button" class="btn ghost" data-f="rs">' + UI.ic('undo') + ' Recuperar una copia</button></div><p class="small muted">Última copia: <b class="bkinfo">' + (S.backupAt ? ago(S.backupAt) : 'ninguna todavía') + '</b>.</p></section>';
  html += '<section class="card panel"><h3>Lecciones</h3><div class="switch"><span>' + UI.ic('unlock') + ' Desbloquear todas las paradas</span><span class="seg" data-k="unlock"><button type="button" data-v="0" class="' + (!S.set.unlockAll ? 'on' : '') + '">Una a una</button><button type="button" data-v="1" class="' + (S.set.unlockAll ? 'on' : '') + '">Todas</button></span></div><p class="small muted">Por defecto cada parada se abre al terminar la lección anterior. Con el examen cerca, puede ser útil abrirlas todas.</p></section>';
  html += '<section class="card panel"><h3>Datos</h3><div class="actions"><button type="button" class="btn ghost" data-f="reset" style="color:var(--no)">' + UI.ic('trash') + ' Borrar todo el progreso</button></div></section>';
  appEl().innerHTML = html;
  $('[data-f="bk"]').onclick = () => { UI.onBackup = () => { $('.bkinfo').textContent = 'hoy'; }; UI.backupSave(); };
  $('[data-f="rs"]').onclick = () => UI.backupPick(txt => { UI.modal('<h2>¿Recuperar esta copia?</h2><p>Sustituye todo el progreso actual.</p>', [{ t: 'Cancelar', cls: 'ghost' }, { t: 'Sí, recuperar', cls: 'primary', fn: () => { const r = UI.restoreJSON(txt); if (r.ok) { UI.go('home'); UI.toast('Copia recuperada'); } else setTimeout(() => UI.modal('<h2>No se ha podido recuperar</h2><p>' + r.m + '</p>'), 50); } }]); });
  $('.seg[data-k="unlock"]').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.set.unlockAll = b.dataset.v === '1'; $$('.seg[data-k="unlock"] button').forEach(x => x.classList.toggle('on', x === b)); UI.save(); UI.snd('tap'); });
  $('[data-f="reset"]').onclick = () => UI.modal('<h2>¿Borrar todo el progreso?</h2><p>Se perderán dinares, niveles, insignias y respuestas escritas. No se puede deshacer.</p>', [{ t: 'Cancelar', cls: 'ghost' }, { t: 'Sí, borrar todo', cls: 'primary', fn: () => { UI.reset(); UI.go('home'); UI.toast('Progreso borrado'); } }]);
};
